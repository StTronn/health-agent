<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" role="img" aria-label="Anatomy: the main agent records facts in the episode, runs three isolated specialists in parallel that read only the files and reference, combines their verdicts, and every reply passes through code guardrails that fix escalation messages and catch missed red flags.">
      <style>
svg{font-family:'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#1d2522}
.bg{fill:#ffffff}
.box{fill:#ffffff;stroke:#1d2522;stroke-width:1.2}
.group{fill:#e6efeb;stroke:#cfd8d4;stroke-width:1}
.codebox{fill:#fbeee5;stroke:#b4561f;stroke-width:1.4}
.files{fill:#ffffff;stroke:#1d2522;stroke-width:1.2;stroke-dasharray:4 3}
.t{fill:#1d2522;font-size:13px}.tb{fill:#1d2522;font-size:14px;font-weight:600}
.ts{fill:#5c6a64;font-size:11.5px}.tm{fill:#1d2522;font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:12px}
.tc{fill:#b4561f;font-size:14px;font-weight:600}.lbl{fill:#5c6a64;font-size:11.5px;font-style:italic}
.edge{stroke:#1d2522;stroke-width:1.3;fill:none}.dash{stroke-dasharray:5 4}
.edge-code{stroke:#b4561f;stroke-width:1.5;fill:none}.emerg{stroke:#b3261e;stroke-width:1.5;fill:none}
.temerg{fill:#b3261e;font-size:13px;font-weight:600}.emergbox{fill:#ffffff;stroke:#b3261e;stroke-width:1.5}
.okbox{fill:#ffffff;stroke:#2f7a43;stroke-width:1.5}.tok{fill:#2f7a43;font-size:13px;font-weight:600}
</style><rect class="bg" x="0" y="0" width="980" height="580" rx="12"/><defs>
        <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2522"/></marker>
        <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4561f"/></marker>
      </defs>

      <!-- Person and reply -->
      <rect class="box" x="20" y="222" width="130" height="60" rx="10"/>
      <text class="tb" x="85" y="248" text-anchor="middle">Parent</text>
      <text class="ts" x="85" y="267" text-anchor="middle">or clinician</text>
      <rect class="box" x="20" y="440" width="130" height="50" rx="10"/>
      <text class="tb" x="85" y="470" text-anchor="middle">Reply</text>

      <!-- Main agent -->
      <rect class="group" x="200" y="120" width="270" height="290" rx="12"/>
      <text class="tb" x="220" y="148">Main agent</text>
      <text class="ts" x="220" y="166">SOUL.md + prompt.md · only it replies</text>
      <text class="tm" x="222" y="200">1 orient: who · which episode</text>
      <text class="tm" x="222" y="226">2 record facts in the episode</text>
      <text class="tm" x="222" y="252">3 run the panel</text>
      <text class="tm" x="222" y="278">4 combine verdicts</text>
      <text class="tm" x="222" y="304">5 check + checklist</text>
      <text class="tm" x="222" y="330">6 act · update the note</text>
      <text class="ts" x="222" y="370">general questions: answered</text>
      <text class="ts" x="222" y="386">from memory or web search</text>

      <!-- Panel -->
      <rect class="group" x="560" y="40" width="210" height="270" rx="12"/>
      <text class="tb" x="578" y="66">Triage panel</text>
      <text class="ts" x="578" y="84">isolated · run in parallel</text>
      <rect class="box" x="578" y="100" width="174" height="56" rx="8"/>
      <text class="tb" x="592" y="123">assess</text>
      <text class="ts" x="592" y="142">differential + level odds</text>
      <rect class="box" x="578" y="168" width="174" height="56" rx="8"/>
      <text class="tb" x="592" y="191">challenge</text>
      <text class="ts" x="592" y="210">more / less urgent · against</text>
      <rect class="box" x="578" y="236" width="174" height="56" rx="8"/>
      <text class="tb" x="592" y="259">ask</text>
      <text class="ts" x="592" y="278">≤ 3 questions or tests</text>

      <!-- Files -->
      <rect class="files" x="560" y="400" width="210" height="150" rx="10"/>
      <text class="tb" x="578" y="426">Files</text>
      <text class="tm" x="578" y="452">episode · ## Triage note</text>
      <text class="tm" x="578" y="474">member files</text>
      <text class="tm" x="578" y="496">MEMORY.md (always in context)</text>
      <text class="tm" x="578" y="518">home-care reference</text>
      <text class="ts" x="578" y="538">family/ · skills/home-care/</text>

      <!-- Guardrails -->
      <rect class="codebox" x="820" y="150" width="145" height="200" rx="10"/>
      <text class="tc" x="836" y="176">Guardrails</text>
      <text class="ts" x="836" y="194">code, always runs</text>
      <text class="t" x="836" y="226">escalate()</text>
      <text class="ts" x="836" y="243">→ fixed message</text>
      <text class="t" x="836" y="275">backstop</text>
      <text class="ts" x="836" y="292">rules + Jev on</text>
      <text class="ts" x="836" y="307">missed red flags</text>
      <text class="t" x="836" y="335">handoffs.md log</text>

      <!-- Edges -->
      <line class="edge" x1="150" y1="252" x2="198" y2="252" marker-end="url(#a)"/>
      <text class="lbl" x="152" y="242">message</text>

      <line class="edge" x1="470" y1="190" x2="558" y2="160" marker-end="url(#a)"/>
      <text class="lbl" x="482" y="162">task × 3</text>
      <line class="edge" x1="558" y1="262" x2="472" y2="262" marker-end="url(#a)"/>
      <text class="lbl" x="484" y="282">verdicts</text>

      <polyline class="edge" points="400,410 400,470 558,470" marker-end="url(#a)"/>
      <text class="lbl" x="410" y="462">writes facts · note</text>

      <line class="edge dash" x1="665" y1="398" x2="665" y2="312" marker-end="url(#a)"/>
      <text class="lbl" x="673" y="362">read files only, never the chat</text>

      <line class="edge-code" x1="470" y1="370" x2="818" y2="330" marker-end="url(#ac)"/>
      <text class="lbl" x="560" y="370">reply · escalate(level)</text>

      <polyline class="edge-code" points="892,350 892,566 85,566 85,492" marker-end="url(#ac)"/>
      <text class="lbl" x="420" y="560">every reply passes through here</text>
    </svg>
